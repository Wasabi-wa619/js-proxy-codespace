<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JS Proxy</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --fg: #1d2129;
        --muted: #69707d;
        --accent: #2f6fed;
        --card: #fff;
        --border: #d7dbe2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171c;
          --fg: #e7e9ee;
          --muted: #9aa1ad;
          --accent: #6b9bff;
          --card: #1f2229;
          --border: #353a45;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      }
      main {
        width: min(640px, 100% - 32px);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1.8rem;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        font-size: 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        padding: 0 18px;
        font-size: 1rem;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .status {
        min-height: 1.5em;
        color: var(--muted);
      }
      .hint {
        color: var(--muted);
        font-size: 0.9rem;
      }
      a {
        color: var(--accent);
      }
      .status.error {
        color: #d93025;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>JS Proxy</h1>
      <form id="go" autocomplete="off">
        <input id="url" type="text" placeholder="URL か検索ワードを入力" autofocus required />
        <button type="submit">開く</button>
      </form>
      <p id="status" class="status" role="status"></p>
      <p class="hint">
        例: <a href="#" data-url="https://example.com">example.com</a> /
        <a href="#" data-url="https://ja.wikipedia.org">ja.wikipedia.org</a>
      </p>
    </main>
    <!-- 外部ファイルにすると、プロキシ以外 (VS Code のプレビュー等) で開いた時に読み込めず無反応になるのでインラインにする -->
    <script>
      'use strict';
      const SEARCH_URL = 'https://duckduckgo.com/html/?q=';

      const form = document.getElementById('go');
      const input = document.getElementById('url');
      const status = document.getElementById('status');

      function showStatus(text, isError) {
        status.textContent = text;
        status.classList.toggle('error', !!isError);
      }

      function toUrl(text) {
        const s = text.trim();
        if (/^https?:\/\//i.test(s)) return s;
        // スペースを含まず "." を含むならドメインとみなす
        if (!/\s/.test(s) && /^[^/]+\.[a-z]{2,}(?::\d+)?(\/.*)?$/i.test(s)) return 'https://' + s;
        return SEARCH_URL + encodeURIComponent(s);
      }

      // このページがプロキシサーバーから配信されているか確認する
      // (VS Code のプレビューや file:// で index.html を直接開いていると動かない)
      const serverOk = fetch('/__px/health', { cache: 'no-store' })
        .then((r) => r.ok && r.text())
        .then((t) => t === 'ok')
        .catch(() => false);

      serverOk.then((ok) => {
        if (!ok) {
          showStatus(
            'プロキシサーバーに接続できません。ターミナルで npm start を実行し、「ポート」タブの 8080 番の URL から開いてください。',
            true,
          );
        }
      });

      // SW が有効になってから移動すると、最初のページから取りこぼしなく中継できる
      const swReady = (async () => {
        if (!('serviceWorker' in navigator)) return 'unsupported';
        try {
          await navigator.serviceWorker.register('/__px/sw.js', { scope: '/' });
          await navigator.serviceWorker.ready;
          return 'ok';
        } catch (e) {
          return 'error: ' + e.message;
        }
      })();

      async function go(text) {
        if (!text.trim()) return;
        if (!(await serverOk)) {
          showStatus('プロキシサーバーに接続できません。ターミナルで npm start が動いているか確認してください。', true);
          return;
        }
        const url = toUrl(text);
        showStatus('読み込み中… ' + url);
        const sw = await Promise.race([swReady, new Promise((r) => setTimeout(() => r('timeout'), 3000))]);
        if (sw !== 'ok') console.warn('[proxy] Service Worker:', sw);
        location.href = '/p/' + url;
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        go(input.value);
      });

      document.querySelectorAll('[data-url]').forEach((a) => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          go(a.dataset.url);
        });
      });
    </script>
  </body>
</html>
