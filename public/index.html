<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JS Proxy</title>
    <link rel="stylesheet" href="/__px/style.css" />
  </head>
  <body>
    <main>
      <h1>JS Proxy</h1>
      <form id="go" autocomplete="off">
        <input id="url" type="text" placeholder="URL か検索ワードを入力" autofocus required />
        <button type="submit">開く</button>
      </form>
      <p id="status" class="status" role="status"></p>
      <p class="hint">
        例: <a href="#" data-url="https://example.com">example.com</a> /
        <a href="#" data-url="https://ja.wikipedia.org">ja.wikipedia.org</a>
      </p>
    </main>
    <script src="/__px/home.js"></script>
  </body>
</html>
